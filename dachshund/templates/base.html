<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ static_url }}/uplot.min.css">
    <link rel="stylesheet" href="{{ static_url }}/dashboard.css">
    {% for url in widget_styles %}
    <link rel="stylesheet" href="{{ url }}">
    {% endfor %}
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <h1 class="service-name">{{ name }}</h1>
        <span class="service-status" title="{{ started_at|timestamp }}">online · {{ started_at|since }}</span>
      </header>
      {% if description %}
      <p class="service-description">{{ description }}</p>
      {% endif %}
      <div class="grid">
        {% block content %}{% endblock %}
      </div>
    </main>
    <footer class="colophon"><a href="https://github.com/PenguinBoi12/dachshund">dachshund</a> - v{{ version }}</footer>
    <script>window.Dachshund = window.Dachshund || { renderers: {}, widget(type, renderer) { this.renderers[type] = renderer; } };</script>
    <script src="{{ static_url }}/uplot.min.js"></script>
    {% for url in widget_scripts %}
    <script src="{{ url }}"></script>
    {% endfor %}
    <script src="{{ static_url }}/dashboard.js"></script>
  </body>
</html>
