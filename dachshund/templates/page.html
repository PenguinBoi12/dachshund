{% extends "base.html" %}

{% block content %}
{% for widget in widgets %}
<section class="card span-{{ widget.size }}"
         data-widget="{{ widget.name }}"
         data-type="{{ widget.type }}"
         data-payload="{{ widget.payload }}">
  <h2 class="card-title">{{ widget.title }}</h2>
  <div class="card-chart"></div>
</section>
{% else %}
<section class="card empty span-3">
  <h2 class="card-title">Nothing here yet</h2>
  <p class="card-body">Register a widget to start building this dashboard.</p>
</section>
{% endfor %}
{% endblock %}
